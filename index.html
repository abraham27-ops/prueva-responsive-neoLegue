<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - NeoLeague</title>
    <meta name="description" content="Página de inicio de sesión para el sistema NeoLeague">
    
    <!-- Link de Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/login.css">
    
    <!-- Favicon -->
    <link rel="icon" href="img/descarga.png">
</head>
<body>

    <main class="tarjetas">
        <header>
            <img src="img/descarga.png" alt="Logo de NeoLeague" class="logoimg">
            <h1>INICIA SESIÓN</h1>
        </header>

        <!-- Agrupación de la información del usuario -->
        <form action="paginas/pantalla_carga.html?destino=inicio" onsubmit="return true;">
            <!-- Correo -->
            <div class="caja-input">
                <label for="correo" class="visually-hidden">Correo Electrónico</label>
                <input type="email" id="correo" placeholder="Correo electrónico" required>
            </div>

            <!-- Contraseña con modo de ojo (👁️ / 👁️‍🗨️) -->
            <div class="caja-input">
                <label for="contrasena" class="visually-hidden">Contraseña</label>
                <input type="password" id="contrasena" placeholder="Contraseña" required>
                <i class="fa-solid fa-eye-slash toggle-password" id="toggleContrasena" title="Mostrar/Ocultar contraseña"></i>
            </div>

            <a href="paginas/recuperar.html" class="enlaceOlvidado">¿Olvidaste tu contraseña?</a>

            <button type="submit" class="botonPrincipal">Iniciar Sesión</button>
        </form>
    </main>

    <script src="js/controllers/index.controllers.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/login.css">
    <title>Recuperar Contraseña</title>
</head>
<body>

    <div class="tarjetas">

        <img src="../img/descarga.png" alt="logo" class="logoimg">

        <h3>Recuperar contraseña</h3>

        <p class="texto-instrucciones">
            Introduce tu correo electrónico para recibir<br>
            un enlace de recuperación
        </p>

        <form>

            <div class="caja-input">
                <input type="email" placeholder="Correo electrónico" required>
            </div>

            <button type="submit" class="botonPrincipal">Enviar enlace</button>

        </form>

    </div>

</body>
</html>

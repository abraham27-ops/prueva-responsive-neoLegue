<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/login.css">
    <title>Recuperar Contraseña - NeoLeague</title>
    <!-- Favicon -->
    <link rel="icon" href="../img/descarga.png">
</head>
<body>

    <div class="tarjetas">
        <img src="../img/descarga.png" alt="logo" class="logoimg">

        <h3>Recuperar contraseña</h3>

        <p class="texto-instrucciones">
            Introduce tu correo electrónico para recibir<br>
            el código de verificación de NeoLeague
        </p>

        <form onsubmit="event.preventDefault(); window.location.href='codigo_verificacion.html';">

            <div class="caja-input">
                <input type="email" placeholder="Correo institucional" required>
            </div>

            <button type="submit" class="botonPrincipal">Enviar código</button>

            <a href="../index.html" class="enlaceOlvidado" style="text-align: center; display: block; margin-top: 20px;">Volver al inicio de sesión</a>
        </form>

    </div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="../js/global.js"></script>
</body>
</html>

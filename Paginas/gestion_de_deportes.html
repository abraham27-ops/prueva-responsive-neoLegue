<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeoLeague - Gestión de Deportes</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/gestion_deportes.css">
    
    <!-- Favicon -->
    <link rel="icon" href="../img/descarga.png">
</head>
<body class="bg-light">

    <!-- NavBar Dinámico -->
    <div id="nav-placeholder"></div>

    <main class="container py-4">
        
        <!-- Encabezado y Botón (Estilo Partidos/Eventos) -->
        <div class="d-flex flex-wrap justify-content-between align-items-end mb-4 gap-3">
            <div>
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb mb-1">
                        <li class="breadcrumb-item"><a href="inicio.html" class="text-decoration-none text-muted">Inicio</a></li>
                        <li class="breadcrumb-item active fw-semibold" aria-current="page">Gestión de Deportes</li>
                    </ol>
                </nav>
                <h1 class="fw-bold m-0 text-dark d-flex align-items-center gap-2">
                    <i class="fas fa-basketball-ball text-success" style="font-size: 1.8rem;"></i> Deportes
                </h1>
            </div>

            <div class="d-flex flex-wrap align-items-center gap-3">
                <button type="button" class="btn btn-success px-4 py-2 fw-semibold rounded-pill shadow-sm d-flex align-items-center" data-bs-toggle="modal" data-bs-target="#modalCrearDeporte" id="btnAbrirModalCrear">
                    <i class="bi bi-plus-circle me-2"></i> Nuevo Deporte
                </button>
            </div>
        </div>

        <!-- Barra de Búsqueda -->
        <div class="bg-white p-3 rounded-pill shadow-sm border mb-4 d-flex justify-content-between align-items-center flex-wrap gap-3">
            <div class="d-flex align-items-center gap-2 text-muted fw-semibold ps-3">
                <i class="fas fa-filter"></i> Filtros
            </div>
            
            <div class="d-flex align-items-center bg-light rounded-pill px-3 py-1 border flex-grow-1" style="max-width: 400px;">
                <i class="bi bi-search text-muted me-2"></i>
                <input type="text" id="txtBuscarDeporte" class="form-control border-0 bg-transparent shadow-none p-1 text-dark" placeholder="Buscar deporte por nombre...">
            </div>
        </div>

        <!-- Tabla Completa (col-12) -->
        <section class="row">
            <div class="col-12">
                <div class="card bg-white border-0 rounded-4 shadow-sm overflow-hidden">
                    <div class="card-header bg-white border-bottom py-3 px-4 d-flex justify-content-between align-items-center">
                        <h5 class="fw-bold mb-0 text-dark">Deportes Registrados</h5>
                        <span class="badge bg-success bg-opacity-10 text-success border border-success fw-semibold px-3 py-2 rounded-pill" id="contadorDeportes">
                            0 deportes
                        </span>
                    </div>

                    <div class="table-responsive">
                        <table class="table table-hover align-middle text-center mb-0" id="tablaEstructura">
                            <thead class="table-light text-muted small fw-semibold text-uppercase">
                                <tr>
                                    <th style="width: 10%;" class="py-3">ID</th>
                                    <th style="width: 15%;" class="py-3">Icono</th>
                                    <th class="text-start py-3">Nombre del Deporte</th>
                                    <th style="width: 15%;" class="py-3">Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="tablaDeportes">
                                <!-- Los deportes se cargarán desde JavaScript -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <!-- Modal para Crear / Editar Deporte -->
    <div class="modal fade" id="modalCrearDeporte" tabindex="-1" aria-labelledby="modalCrearDeporteLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content rounded-4 shadow border-0 overflow-hidden">
                
                <div class="modal-header bg-success text-white border-0 px-4 py-3" style="background-color: var(--primary-color) !important;">
                    <h5 class="modal-title fw-bold d-flex align-items-center" id="modalCrearDeporteLabel">
                        <i class="fas fa-plus-circle text-warning me-2"></i> Registrar Deporte
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                
                <form id="frmDeporte" onsubmit="return false;">
                    <input type="hidden" id="idDeporte">
                    
                    <div class="modal-body p-4">
                        <div class="row g-4">
                            <!-- Nombre del deporte -->
                            <div class="col-12">
                                <label for="txtNombreDeporte" class="form-label fw-bold text-dark mb-1">
                                    Nombre del Deporte <span class="text-danger">*</span>
                                </label>
                                <input type="text" id="txtNombreDeporte" class="form-control form-control-custom rounded-3" placeholder="Ej. Fútbol, Baloncesto, Natación..." required>
                            </div>

                            <!-- Imagen del deporte (Mantenemos la idea pero más formal para API) -->
                            <div class="col-12">
                                <label for="fileImagenDeporte" class="form-label fw-bold text-dark mb-1">
                                    Imagen Representativa (Icono) <span class="text-muted small fw-normal">(Opcional)</span>
                                </label>
                                <input class="form-control form-control-custom rounded-3" type="file" id="fileImagenDeporte" accept="image/png, image/jpeg">
                                <div class="form-text text-muted small mt-1"><i class="bi bi-info-circle"></i> Sube un icono o imagen relacionada (PNG o JPG).</div>
                            </div>
                        </div>
                    </div>

                    <div class="modal-footer bg-light px-4 py-3 border-top">
                        <button type="button" class="btn btn-secondary rounded-pill px-4 fw-semibold" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" id="btnGuardarDeporte" class="btn btn-success rounded-pill px-4 fw-bold shadow-sm" style="background-color: var(--primary-color); border-color: var(--primary-color);">
                            <i class="fas fa-save me-1"></i> Guardar Deporte
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- Scripts Propios -->
    <script src="../js/global.js"></script>
    <script src="../js/controllers/gestion_deportes.controllers.js"></script>
</body>
</html>

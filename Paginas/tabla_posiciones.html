<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabla de Posiciones - NeoLeague</title>

    <!-- Bootstrap 5 CSS (primero, para que nuestros estilos puedan sobreescribirlo) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Custom CSS (despues de Bootstrap para ganar especificidad) -->
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/inicio.css">
    <link rel="stylesheet" href="../css/tabla_posiciones.css">
    <!-- Favicon -->
    <link rel="icon" href="../img/descarga.png">
</head>
<body class="tabla-page">

    <div id="nav-placeholder"></div>

    <div class="container-fluid px-4 py-4" style="max-width: 1200px; margin: 0 auto;">

        <!-- Encabezado -->
        <div class="tabla-header d-flex flex-wrap justify-content-between align-items-center mb-4 gap-3">
            <div>
                <p class="text-muted small mb-0">Inicio / Tabla de posiciones</p>
                <h1 class="mb-0">Tabla de posiciones</h1>
            </div>
            <!-- Filtros -->
            <div class="filters-wrapper d-flex gap-3 flex-wrap align-items-center w-100 mt-2">
                
                <!-- Filtro Torneo -->
                <div class="filter-group flex-grow-1 flex-md-grow-0">
                    <div class="filter-icon shadow-sm"><i class="fa-solid fa-trophy"></i></div>
                    <select id="tournament-filter" class="form-select form-select-custom w-100">
                        <option value="intramuros2026" data-deporte="futbol_masculino" selected>Intramuros 2026 (Fútbol Masc.)</option>
                        <option value="copa_neo" data-deporte="natacion">Copa Neo 2026 (Natación)</option>
                        <option value="intercolegial" data-deporte="baloncesto">Torneo Intercolegial (Baloncesto)</option>
                        <option value="relampago" data-deporte="voleibol">Torneo Relámpago (Voleibol)</option>
                        <option value="femenino2026" data-deporte="futbol_femenino">Copa Femenina 2026 (Fútbol Fem.)</option>
                    </select>
                </div>

                <!-- Filtro Deporte -->
                <div class="filter-group flex-grow-1 flex-md-grow-0">
                    <div class="filter-icon shadow-sm"><i class="fa-solid fa-medal"></i></div>
                    <select id="sport-filter" class="form-select form-select-custom w-100">
                        <option value="futbol_masculino" selected>Fútbol Masculino</option>
                        <option value="futbol_femenino">Fútbol Femenino</option>
                        <option value="baloncesto">Baloncesto</option>
                        <option value="voleibol">Voleibol</option>
                        <option value="natacion">Natación (Medallero General)</option>
                    </select>
                </div>
                
                <!-- Filtro Grupo -->
                <div class="filter-group flex-grow-1 flex-md-grow-0">
                    <div class="filter-icon shadow-sm"><i class="fa-solid fa-layer-group"></i></div>
                    <select id="group-filter" class="form-select form-select-custom w-100">
                        <option value="todos" selected>Todos los grupos</option>
                        <option value="grupo_a">Grupo A</option>
                        <option value="grupo_b">Grupo B</option>
                        <option value="grupo_c">Grupo C</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Tabla -->
        <div class="tabla-card">
            <div class="table-responsive">
                <table class="table table-borderless mb-0 text-center">

                    <thead class="table-custom-header">
                        <tr>
                            <th class="text-start">POS</th>
                            <th class="text-start">EQUIPO</th>
                            <th>PJ</th>
                            <th>PG</th>
                            <th>PE</th>
                            <th>PP</th>
                            <th>GF</th>
                            <th>GC</th>
                            <th>DG</th>
                            <th>PTS</th>
                        </tr>
                    </thead>

                    <tbody id="standings-table-body">

                        <tr class="table-custom-row">
                            <td class="text-start">
                                <span class="pos-badge pos-1">1</span>
                            </td>
                            <td class="text-start">
                                <div class="d-flex align-items-center gap-3">
                                    <img src="../img/itr.jpg" class="team-logo-small" alt="Ricaldone">
                                    <span class="fw-bold">Ricaldone</span>
                                </div>
                            </td>
                            <td>4</td>
                            <td>3</td>
                            <td class="td-zero">0</td>
                            <td>5</td>
                            <td class="text-success fw-bold">10</td>
                            <td>9</td>
                            <td class="dg-pos">+7</td>
                            <td><span class="pts-cell">10</span></td>
                        </tr>

                        <tr class="table-custom-row">
                            <td class="text-start">
                                <span class="pos-badge pos-2">2</span>
                            </td>
                            <td class="text-start">
                                <div class="d-flex align-items-center gap-3">
                                    <img src="../img/itr.jpg" class="team-logo-small" alt="Ricaldone">
                                    <span class="fw-bold">Ricaldone</span>
                                </div>
                            </td>
                            <td>4</td>
                            <td>6</td>
                            <td>7</td>
                            <td class="td-zero">0</td>
                            <td class="td-zero">0</td>
                            <td>8</td>
                            <td class="dg-pos">+9</td>
                            <td><span class="pts-cell">7</span></td>
                        </tr>

                        <tr class="table-custom-row">
                            <td class="text-start">
                                <span class="pos-badge pos-3">3</span>
                            </td>
                            <td class="text-start">
                                <div class="d-flex align-items-center gap-3">
                                    <img src="../img/itr.jpg" class="team-logo-small" alt="Ricaldone">
                                    <span class="fw-bold">Ricaldone</span>
                                </div>
                            </td>
                            <td>4</td>
                            <td>7</td>
                            <td>9</td>
                            <td>8</td>
                            <td>6</td>
                            <td>7</td>
                            <td class="dg-pos">+10</td>
                            <td><span class="pts-cell">8</span></td>
                        </tr>

                        <tr class="table-custom-row">
                            <td class="text-start">
                                <span class="pos-badge pos-other">4</span>
                            </td>
                            <td class="text-start">
                                <div class="d-flex align-items-center gap-3">
                                    <img src="../img/itr.jpg" class="team-logo-small" alt="Ricaldone">
                                    <span class="fw-bold">Ricaldone</span>
                                </div>
                            </td>
                            <td>4</td>
                            <td>8</td>
                            <td>5</td>
                            <td>4</td>
                            <td>3</td>
                            <td>10</td>
                            <td class="dg-pos">+1</td>
                            <td><span class="pts-cell">4</span></td>
                        </tr>

                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/global.js"></script>
    <script src="../js/tabla_posiciones.js"></script>
</body>
</html>

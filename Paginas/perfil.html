<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil - NeoLeague</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome y Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/inicio.css">
    <link rel="stylesheet" href="../css/perfil.css">
    <!-- Favicon -->
    <link rel="icon" href="../img/descarga.png">
</head>
<body class="perfil-page">

    <!-- Navbar dinámico -->
    <div id="nav-placeholder"></div>

    <div class="container-fluid px-4 py-4" style="max-width: 1100px; margin: 0 auto;">
        <h2 class="fw-bold mb-4">Configuración</h2>

        <!-- Tarjeta principal -->
        <div class="perfil-card">
            <div class="row gx-5">

                <!-- ── Col Izquierda: Avatar ── -->
                <div class="col-md-4 perfil-foto-col mb-4 mb-md-0">

                    <!-- Avatar circular con gradiente -->
                    <div class="perfil-avatar-wrapper">
                        <div class="perfil-avatar">
                            <i class="fa-solid fa-user"></i>
                        </div>
                        <button class="perfil-avatar-edit" title="Cambiar foto">
                            <i class="fa-solid fa-camera"></i>
                        </button>
                    </div>

                    <p class="perfil-name">Juan Pérez</p>
                    <span class="perfil-role-badge">Profesor Guía</span>

                    <!-- Botones de acción -->
                    <div class="d-flex flex-column gap-3 w-100 mt-2" style="max-width: 220px;">
                        <button type="button" class="btn-perfil-primary">Guardar cambios</button>
                        <button type="button" id="btnCerrarSesion" class="btn-perfil-danger">Cerrar sesión</button>
                    </div>
                </div>

                <!-- ── Col Derecha: Formulario ── -->
                <div class="col-md-8">
                    <h5 class="fw-bold mb-4 text-dark">Información personal</h5>
                    <form class="perfil-form">
                        <div class="row g-4">
                            <div class="col-md-6">
                                <label class="form-label">Nombre completo</label>
                                <input type="text" class="form-control" value="Juan Pérez" readonly>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Correo electrónico</label>
                                <input type="email" class="form-control" value="juan@gmail.com">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Teléfono</label>
                                <input type="text" class="form-control" value="7847-4060">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Rol</label>
                                <input type="text" class="form-control" value="Entrenador" readonly>
                            </div>
                            <!-- Especialidad (solo para Profesor Guía) -->
                            <div class="col-12" id="especialidadContainer">
                                <label class="form-label">Especialidad (Profesor Guía)</label>
                                <input type="text" class="form-control" value="Desarrollo de Software" readonly>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- Sección de Favoritos -->
        <div class="favoritos-section">
            <div class="d-flex flex-wrap justify-content-between align-items-center mb-4">
                <h3 class="fw-bold m-0">Mis Favoritos <i class="fa-solid fa-star text-warning ms-1"></i></h3>
                <!-- Filtros -->
                <div class="d-flex gap-2 mt-2 mt-md-0" id="filtrosFavoritos">
                    <button class="btn-filtro active" data-filter="all">Todos</button>
                    <button class="btn-filtro" data-filter="equipo">Equipos</button>
                    <button class="btn-filtro" data-filter="jugador">Jugadores</button>
                    <button class="btn-filtro" data-filter="torneo">Torneos</button>
                </div>
            </div>

            <div class="row row-cols-1 row-cols-md-3 g-4" id="listaFavoritos">

                <!-- Equipo Favorito -->
                <div class="col fav-item" data-type="equipo">
                    <div class="fav-card">
                        <div class="d-flex align-items-center gap-3">
                            <img src="../img/donBosco.jpg" alt="Equipo" class="fav-card-icon shadow-sm">
                            <div>
                                <h6 class="fw-bold mb-0">Don Bosco</h6>
                                <small class="text-muted">Equipo · Fútbol</small>
                            </div>
                        </div>
                        <button class="heart-btn active">
                            <i class="fa-solid fa-heart"></i>
                        </button>
                    </div>
                </div>

                <!-- Jugador Favorito -->
                <div class="col fav-item" data-type="jugador">
                    <div class="fav-card">
                        <div class="d-flex align-items-center gap-3">
                            <img src="https://ui-avatars.com/api/?name=Carlos+Lopez&background=2e8b57&color=fff&rounded=true" alt="Jugador" class="fav-card-icon">
                            <div>
                                <h6 class="fw-bold mb-0">Carlos López</h6>
                                <small class="text-muted">Jugador · 9-A</small>
                            </div>
                        </div>
                        <button class="heart-btn active">
                            <i class="fa-solid fa-heart"></i>
                        </button>
                    </div>
                </div>

                <!-- Torneo Favorito -->
                <div class="col fav-item" data-type="torneo">
                    <div class="fav-card">
                        <div class="d-flex align-items-center gap-3">
                            <div class="fav-card-icon d-flex align-items-center justify-content-center shadow-sm" style="background: linear-gradient(135deg,#1a4a1a,#2e8b57);">
                                <i class="fa-solid fa-trophy text-warning fs-5"></i>
                            </div>
                            <div>
                                <h6 class="fw-bold mb-0">Intramuros 2026</h6>
                                <small class="text-muted">Torneo</small>
                            </div>
                        </div>
                        <button class="heart-btn active">
                            <i class="fa-solid fa-heart"></i>
                        </button>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../js/global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/perfil.js"></script>
</body>
</html>

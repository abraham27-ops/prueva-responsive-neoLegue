<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/login.css">
    <title>Código de Verificación - NeoLeague</title>
    <!-- Favicon -->
    <link rel="icon" href="../img/descarga.png">

</head>
<body>

    <div class="tarjetas">
        <img src="../img/descarga.png" alt="logo" class="logoimg">

        <h3>Código de verificación</h3>

        <p class="texto-instrucciones">
            Introduce el código de seguridad de 6 dígitos<br>
            que hemos enviado a tu correo institucional
        </p>

        <form onsubmit="event.preventDefault(); window.location.href='cambiar_contrasena.html';">

            <div class="otp-container">
                <input type="text" maxlength="1" class="otp-input" required value="7">
                <input type="text" maxlength="1" class="otp-input" required value="4">
                <input type="text" maxlength="1" class="otp-input" required value="9">
                <input type="text" maxlength="1" class="otp-input" required value="2">
                <input type="text" maxlength="1" class="otp-input" required value="1">
                <input type="text" maxlength="1" class="otp-input" required value="5">
            </div>

            <button type="submit" class="botonPrincipal">Verificar código</button>

            <div style="margin-top: 25px;">
                <span style="font-size: 13px; color: #666;">¿No recibiste el código?</span>
                <a href="#" onclick="Swal.fire({icon: 'success', title: '¡Código reenviado!', text: 'Revisa la bandeja de entrada de tu correo institucional.', confirmButtonColor: '#226137'}); return false;" class="enlaceOlvidado" style="display: inline; margin-left: 5px;">Reenviar ahora</a>
            </div>
        </form>

    </div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="../js/global.js"></script>
<script src="../js/controllers/codigo_verificacion.controllers.js"></script>
</body>
</html>

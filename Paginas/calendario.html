<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeoLeague - Cronograma</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/calendario.css">
    
    <!-- Favicon -->
    <link rel="icon" href="../img/descarga.png">
</head>
<body class="bg-light">

    <!-- NavBar Dinámico -->
    <div id="nav-placeholder"></div>

    <main class="container py-4">
        
        <!-- Encabezado Estilo Institucional -->
        <div class="d-flex flex-wrap justify-content-between align-items-end mb-4 gap-3">
            <div>
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb mb-1">
                        <li class="breadcrumb-item"><a href="inicio.html" class="text-decoration-none text-muted">Inicio</a></li>
                        <li class="breadcrumb-item active fw-semibold" aria-current="page">Cronograma</li>
                    </ol>
                </nav>
                <h1 class="fw-bold m-0 text-dark d-flex align-items-center gap-2">
                    <i class="fas fa-calendar-alt text-success" style="font-size: 1.8rem;"></i> Cronograma Oficial
                </h1>
                <p class="text-muted small mt-1 mb-0">Visualiza la programación cronológica de torneos y partidos generada automáticamente.</p>
            </div>
            
            <div class="d-flex flex-column align-items-end gap-3">
                <!-- Toggle de Vista (Agenda vs Tarjetas vs Mensual) -->
                <div class="btn-group shadow-sm" role="group" aria-label="Vista del Cronograma">
                    <input type="radio" class="btn-check" name="btnVista" id="btnVistaAgenda" autocomplete="off" checked>
                    <label class="btn btn-outline-success fw-semibold px-3" for="btnVistaAgenda"><i class="bi bi-list-ul me-1"></i> Agenda</label>

                    <input type="radio" class="btn-check" name="btnVista" id="btnVistaTarjetas" autocomplete="off">
                    <label class="btn btn-outline-success fw-semibold px-3" for="btnVistaTarjetas"><i class="bi bi-grid-fill me-1"></i> Tarjetas</label>

                    <input type="radio" class="btn-check" name="btnVista" id="btnVistaMensual" autocomplete="off">
                    <label class="btn btn-outline-success fw-semibold px-3" for="btnVistaMensual"><i class="bi bi-calendar3 me-1"></i> Mensual</label>
                </div>

                <!-- Filtros Rápidos (Botones Pill) -->
                <div class="d-flex gap-2">
                    <button class="btn btn-filter-crono active" data-filter="todos">
                        <i class="bi bi-funnel-fill me-1"></i> Todo
                    </button>
                    <button class="btn btn-filter-crono" data-filter="torneo">
                        <i class="fas fa-trophy me-1 text-warning"></i> Torneos
                    </button>
                    <button class="btn btn-filter-crono" data-filter="partido">
                        <i class="far fa-futbol me-1 text-primary"></i> Partidos
                    </button>
                </div>
            </div>
        </div>

        <!-- Contenedor Principal del Cronograma (Renderizado por JS) -->
        <section class="row">
            <div class="col-12 col-lg-10 mx-auto">
                <div id="cronogramaContainer" class="pb-5">
                    <!-- Aquí se inyectarán los bloques de fecha y timeline desde JS -->
                </div>
            </div>
        </section>

    </main>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Scripts Institucionales -->
    <script src="../js/global.js"></script>
    <script src="../js/controllers/calendario.controllers.js?v=1.1"></script>

</body>
</html>

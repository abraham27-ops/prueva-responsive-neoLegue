<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NeoLeague - Crear partido</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <main id="contenido-crear-partido" class="p-4 bg-light min-vh-100">

        <nav class="mb-4" aria-label="Navegación de regreso">

            <a id="btn-volver-partidos" href="./gestionPartidos.html"
                class="btn btn-outline-success rounded-pill px-4 py-2 d-inline-flex align-items-center">

                <span class="me-2" aria-hidden="true">
                    ←
                </span>

                Volver

            </a>

        </nav>

        <section class="bg-white rounded-4 p-4 shadow-sm" aria-labelledby="titulo-crear-partido">

            <h1 id="titulo-crear-partido" class="h2 fw-bold mb-4">
                Crea un nuevo partido
            </h1>

            <form id="form-crear-partido">

                <div class="row">

                    <div class="col-md-6">

                        <div class="mb-4">

                            <label for="select-torneo" class="form-label">
                                Torneo
                            </label>

                            <select id="select-torneo" name="torneo" class="form-select form-select-lg rounded-pill">

                                <option value="" selected>
                                    Selecciona torneo
                                </option>

                            </select>

                        </div>

                        <div class="mb-4">

                            <label for="select-deporte" class="form-label">
                                Deporte
                            </label>

                            <select id="select-deporte" name="deporte" class="form-select form-select-lg rounded-pill">

                                <option value="" selected>
                                    Seleccionar deporte
                                </option>

                            </select>

                        </div>

                        <fieldset class="mb-4">

                            <legend class="form-label">
                                Equipos que jugarán
                            </legend>

                            <label for="select-equipo-1" class="visually-hidden">
                                Equipo 1
                            </label>

                            <select id="select-equipo-1" name="equipo1"
                                class="form-select form-select-lg rounded-pill mb-3">

                                <option value="" selected>
                                    Seleccionar equipo 1
                                </option>

                            </select>

                            <label for="select-equipo-2" class="visually-hidden">
                                Equipo 2
                            </label>

                            <select id="select-equipo-2" name="equipo2" class="form-select form-select-lg rounded-pill">

                                <option value="" selected>
                                    Seleccionar equipo 2
                                </option>

                            </select>

                        </fieldset>

                    </div>

                    <div class="col-md-6">

                        <div class="mb-4">

                            <label for="input-fecha-hora" class="form-label">
                                Fecha y hora
                            </label>

                            <input id="input-fecha-hora" name="fechaHora" type="datetime-local"
                                class="form-control form-control-lg rounded-pill">

                        </div>

                        <div class="mb-4">

                            <label for="select-estado-partido" class="form-label">
                                Estado del partido
                            </label>

                            <select id="select-estado-partido" name="estado"
                                class="form-select form-select-lg rounded-pill">

                                <option value="" selected>
                                    Seleccionar estado
                                </option>

                                <option value="activo">
                                    Activo
                                </option>

                                <option value="inactivo">
                                    Inactivo
                                </option>

                            </select>

                        </div>

                        <div class="mb-5">

                            <label for="select-lugar" class="form-label">
                                Lugar
                            </label>

                            <select id="select-lugar" name="lugar" class="form-select form-select-lg rounded-pill">

                                <option value="" selected>
                                    Lugar de juego
                                </option>

                            </select>

                        </div>

                        <div class="text-center mt-5">

                            <button id="btn-crear-partido" type="button"
                                class="btn btn-success rounded-pill px-4 py-2 w-100 mb-3 d-inline-flex align-items-center justify-content-center">

                                <img src="../img/Plus.png" alt="" width="24" height="24" class="btn-icon-space me-2">

                                Crear partido

                            </button>

                            <div class="d-flex gap-2 justify-content-center">

                                <button id="btn-actualizar-partido" type="button"
                                    class="btn btn-success rounded-pill px-4 py-2 flex-grow-1">

                                    <img src="../img/Vector.png" alt="" width="20" height="20" class="btn-icon-space">

                                    Actualizar

                                </button>

                                <button id="btn-eliminar-partido" type="button"
                                    class="btn btn-danger rounded-pill px-4 py-2 flex-grow-1">

                                    <img src="../img/trashGray.png" alt="" width="20" height="20"
                                        class="btn-icon-space">

                                    Eliminar

                                </button>

                            </div>

                        </div>

                    </div>

                </div>

            </form>

        </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>

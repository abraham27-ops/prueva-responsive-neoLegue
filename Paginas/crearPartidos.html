<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeoLeague - Crear partido</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <main class="p-4 bg-light min-vh-100">
            <div class="mb-4">
                <a href="./gestionPartidos.html"
                    class="btn btn-outline-success rounded-pill px-4 py-2 d-inline-flex align-items-center">
                    <span class="me-2">←</span>
                    Volver
                </a>
            </div>

            <div class="bg-white rounded-4 p-4 shadow-sm">

                <h1 class="h2 fw-bold mb-4">
                    Crea un nuevo partido
                </h1>

                <div class="row">

                    <div class="col-md-6">

                        <div class="mb-4">
                            <label class="form-label">Torneo</label>
                            <select class="form-select form-select-lg rounded-pill">
                                <option>Selecciona torneo</option>
                            </select>
                        </div>

                        <div class="mb-4">
                            <label class="form-label">Deporte</label>
                            <select class="form-select form-select-lg rounded-pill">
                                <option>Seleccionar deporte</option>
                            </select>
                        </div>

                        <div class="mb-4">
                            <label class="form-label">
                                Equipos que jugarán
                            </label>

                            <select class="form-select form-select-lg rounded-pill mb-3">
                                <option>Seleccionar equipo 1</option>
                            </select>

                            <select class="form-select form-select-lg rounded-pill">
                                <option>Seleccionar equipo 2</option>
                            </select>
                        </div>

                    </div>

                    <div class="col-md-6">

                        <div class="mb-4">
                            <label class="form-label">
                                Fecha y hora
                            </label>

                            <input type="datetime-local" class="form-control form-control-lg rounded-pill">
                        </div>

                        <div class="mb-4">
                            <label class="form-label">
                                Estado del partido
                            </label>

                            <select class="form-select form-select-lg rounded-pill">
                                <option value="" selected>Seleccionar estado</option>
                                <option value="activo">Activo</option>
                                <option value="inactivo">Inactivo</option>
                            </select>
                        </div>

                        <div class="mb-5">
                            <label class="form-label">
                                Lugar
                            </label>

                            <select class="form-select form-select-lg rounded-pill">
                                <option>Lugar de juego</option>
                            </select>
                        </div>

                        <div class="text-center mt-5">
                            <button type="button"
                                class="btn btn-success rounded-pill px-4 py-2 w-100 mb-3 d-inline-flex align-items-center justify-content-center">
                                <img src="../img/plus.png" alt="Crear" width="24" height="24"
                                    class="btn-icon-space me-2">
                                Crear partido
                            </button>

                            <div class="d-flex gap-2 justify-content-center">
                                <button type="button" class="btn btn-success rounded-pill px-4 py-2 flex-grow-1">
                                    <img src="../img/Vector.png" alt="Actualizar" width="20" height="20"
                                        class="btn-icon-space">
                                    Actualizar
                                </button>

                                <button type="button" class="btn btn-danger rounded-pill px-4 py-2 flex-grow-1">
                                    <img src="../img/trashGray.png" alt="Eliminar" width="20" height="20"
                                        class="btn-icon-space">
                                    Eliminar
                                </button>
                            </div>
                        </div>

                    </div>

                </div>

            </div>
        </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>

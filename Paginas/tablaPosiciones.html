<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabla de Posiciones - Dashboard</title>
    
    <link rel="stylesheet" href="../css/tablaPosiciones.css">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    
    <!-- Link de Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

<!-- NavBar -->
    <nav class="navbar py-3 ps-4 pe-2 border-bottom bg-dark">
        <div class="container-fluid d-flex justify-content-between align-items-center">
            <button class="btn p-0 me-3 text-white" type="button" data-bs-toggle="offcanvas"
                data-bs-target="#menu_lateral" style="font-size: 1.5rem; text-decoration: none;">
                <i class="fas fa-bars"></i>
            </button>

            <span class="navbar-brand mb-0 h1 fw-bold uppercase text-white tracking-wider m-0"
                style="font-size: 1.25rem;">
                <i class="fa-regular fa-futbol"></i> NeoLeague
            </span>
        </div>
    </nav>

    <!-- Menú lateral -->
    <div class="offcanvas offcanvas-start border-end bg-dark border-end border-dark" tabindex="-1" id="menu_lateral">

        <div class="offcanvas-header flex-column align-items-start px-4 pt-4 pb-2 border-bottom border-white-5">
            <div class="d-flex align-items-center w-100 justify-content-between mb-3">
                <h5 class="offcanvas-title font-title-md text-white font-bold m-0" id="menu_lateral_label">
                    <i class="fa-regular fa-user me-2"></i>NOMBRE USUARIO
                </h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
            </div>
        </div>

        <!-- Opción Inicio -->
        <div class="offcanvas-body px-0 py-0 flex-grow-1">
            <div class="d-flex flex-column gap-1 text-white">
                <a class="item_sidebar d-flex align-items-center text-white gap-3 px-4 py-3 text-decoration-none"
                    href="#">
                    <i class="fa-solid fa-house"></i>
                    <span class="text-uppercase" style="font-size: 1rem;">Inicio</span>
                </a>
            </div>


            <!-- Opción Especialidades -->
            <div class="d-flex flex-column gap-1 text-white">
                <a class="item_sidebar d-flex align-items-center text-white gap-3 px-4 py-3 text-decoration-none"
                    href="#">
                    <i class="fa-solid fa-screwdriver-wrench"></i>
                    <span class="text-uppercase" style="font-size: 1rem;">ESPECIALIDADES</span>
                </a>
            </div>

        </div>

        <div class="offcanvas-footer p-4 border-top border-white-5 mt-auto">
            <a id=""
                class="btn btn-danger border-2 border-dark w-100 d-flex align-items-center justify-content-center gap-2 py-2 text-decoration-none">
                <i class="fas fa-sign-out-alt"></i>
                <span>Cerrar Sesión</span>
            </a>
        </div>

    </div>
    
<div class="container-fluid px-4 py-4 max-w-1200" style="max-width: 1400px; margin: 0 auto;">
    
    
    <header class="mb-5">
        <h1 class="fw-normal mb-0">Tabla de posiciones</h1>
    </header>

    
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-3">
        <select id="sport-filter" class="form-select form-select-custom shadow-sm w-auto">
            <option value="futbol_masculino" selected>Futbol masculino</option>
            <option value="futbol_femenino">Futbol femenino</option>
            <option value="baloncesto">Baloncesto</option>
        </select>

    
        <select id="group-filter" class="form-select form-select-custom shadow-sm w-auto">
            <option value="grupo_a" selected>Grupo A</option>
            <option value="grupo_b">Grupo B</option>
        </select>
    </div>

    
    <div class="card rounded-4-custom border-1 shadow-sm overflow-hidden">
        <div class="table-responsive">
            
            <table class="table table-borderless mb-0 text-center">
                
                
                <thead class="table-custom-header">
                    <tr>
                        <th class="text-start ps-4 py-4">Pos</th>
                        <th class="text-start py-4">Equipo</th>
                        <th class="py-4">PJ</th>
                        <th class="py-4">PG</th>
                        <th class="py-4">PE</th>
                        <th class="py-4">PP</th>
                        <th class="py-4">GF</th>
                        <th class="py-4">GC</th>
                        <th class="py-4">DG</th>
                        <th class="pe-4 py-4">PTS</th>
                    </tr>
                </thead>

                
                <tbody id="standings-table-body">
                    
                    
                    <tr class="table-custom-row border-bottom">
                        <td class="text-start ps-4 fw-bold">1</td>
                        <td class="text-start">
                            <div class="d-flex align-items-center">
                                <img src="../img/itr.jpg" class="team-logo-small me-3" alt="Logo Ricaldone">
                                <span class="fw-bold">Ricaldone</span>
                            </div>
                        </td>
                        <td>4</td>
                        <td>3</td>
                        <td>0</td>
                        <td>5</td>
                        <td>10</td>
                        <td>9</td>
                        <td>+7</td>
                        <td class="pe-4 fw-bold">10</td>
                    </tr>

                    
                    <tr class="table-custom-row border-bottom">
                        <td class="text-start ps-4 fw-bold">2</td>
                        <td class="text-start">
                            <div class="d-flex align-items-center">
                                <img src="../img/itr.jpg" class="team-logo-small me-3" alt="Logo Ricaldone">
                                <span class="fw-bold">Ricaldone</span>
                            </div>
                        </td>
                        <td>4</td>
                        <td>6</td>
                        <td>7</td>
                        <td>0</td>
                        <td>0</td>
                        <td>8</td>
                        <td>+9</td>
                        <td class="pe-4 fw-bold">7</td>
                    </tr>

                    
                    <tr class="table-custom-row border-bottom">
                        <td class="text-start ps-4 fw-bold">3</td>
                        <td class="text-start">
                            <div class="d-flex align-items-center">
                                <img src="../img/itr.jpg" class="team-logo-small me-3" alt="Logo Ricaldone">
                                <span class="fw-bold">Ricaldone</span>
                            </div>
                        </td>
                        <td>4</td>
                        <td>7</td>
                        <td>9</td>
                        <td>8</td>
                        <td>6</td>
                        <td>7</td>
                        <td>+10</td>
                        <td class="pe-4 fw-bold">8</td>
                    </tr>
                    
                    
                    <tr class="table-custom-row border-bottom">
                        <td class="text-start ps-4 fw-bold">4</td>
                        <td class="text-start">
                            <div class="d-flex align-items-center">
                                <img src="../img/itr.jpg" class="team-logo-small me-3" alt="Logo Ricaldone">
                                <span class="fw-bold">Ricaldone</span>
                            </div>
                        </td>
                        <td>4</td>
                        <td>8</td>
                        <td>5</td>
                        <td>4</td>
                        <td>3</td>
                        <td>10</td>
                        <td>+1</td>
                        <td class="pe-4 fw-bold">4</td>
                    </tr>

                </tbody>
            </table>
        </div>
    </div>

</div>

<!-- Link de SweetAlert -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!--Script de Bootstrap  -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

</body>
</html>

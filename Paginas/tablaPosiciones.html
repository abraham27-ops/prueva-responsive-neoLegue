<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabla de Posiciones - Dashboard</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="container-fluid px-4 py-4 max-w-1200" style="max-width: 1400px; margin: 0 auto;">
    
    
    <header class="mb-5">
        <h1 class="fw-normal mb-0">Tabla de posiciones</h1>
    </header>

    
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-3">
        <select id="sport-filter" class="form-select form-select-custom shadow-sm w-auto">
            <option value="futbol_masculino" selected>Futbol masculino</option>
            <option value="futbol_femenino">Futbol femenino</option>
            <option value="baloncesto">Baloncesto</option>
        </select>

    
        <select id="group-filter" class="form-select form-select-custom shadow-sm w-auto">
            <option value="grupo_a" selected>Grupo A</option>
            <option value="grupo_b">Grupo B</option>
        </select>
    </div>

    
    <div class="card rounded-4-custom border-1 shadow-sm overflow-hidden">
        <div class="table-responsive">
            
            <table class="table table-borderless mb-0 text-center">
                
                
                <thead class="table-custom-header">
                    <tr>
                        <th class="text-start ps-4 py-4">Pos</th>
                        <th class="text-start py-4">Equipo</th>
                        <th class="py-4">PJ</th>
                        <th class="py-4">PG</th>
                        <th class="py-4">PE</th>
                        <th class="py-4">PP</th>
                        <th class="py-4">GF</th>
                        <th class="py-4">GC</th>
                        <th class="py-4">DG</th>
                        <th class="pe-4 py-4">PTS</th>
                    </tr>
                </thead>

                
                <tbody id="standings-table-body">
                    
                    
                    <tr class="table-custom-row border-bottom">
                        <td class="text-start ps-4 fw-bold">1</td>
                        <td class="text-start">
                            <div class="d-flex align-items-center">
                                <img src="../img/itr.jpg" class="team-logo-small me-3" alt="Logo Ricaldone">
                                <span class="fw-bold">Ricaldone</span>
                            </div>
                        </td>
                        <td>4</td>
                        <td>3</td>
                        <td>0</td>
                        <td>5</td>
                        <td>10</td>
                        <td>9</td>
                        <td>+7</td>
                        <td class="pe-4 fw-bold">10</td>
                    </tr>

                    
                    <tr class="table-custom-row border-bottom">
                        <td class="text-start ps-4 fw-bold">2</td>
                        <td class="text-start">
                            <div class="d-flex align-items-center">
                                <img src="../img/itr.jpg" class="team-logo-small me-3" alt="Logo Ricaldone">
                                <span class="fw-bold">Ricaldone</span>
                            </div>
                        </td>
                        <td>4</td>
                        <td>6</td>
                        <td>7</td>
                        <td>0</td>
                        <td>0</td>
                        <td>8</td>
                        <td>+9</td>
                        <td class="pe-4 fw-bold">7</td>
                    </tr>

                    
                    <tr class="table-custom-row border-bottom">
                        <td class="text-start ps-4 fw-bold">3</td>
                        <td class="text-start">
                            <div class="d-flex align-items-center">
                                <img src="../img/itr.jpg" class="team-logo-small me-3" alt="Logo Ricaldone">
                                <span class="fw-bold">Ricaldone</span>
                            </div>
                        </td>
                        <td>4</td>
                        <td>7</td>
                        <td>9</td>
                        <td>8</td>
                        <td>6</td>
                        <td>7</td>
                        <td>+10</td>
                        <td class="pe-4 fw-bold">8</td>
                    </tr>
                    
                    
                    <tr class="table-custom-row border-bottom">
                        <td class="text-start ps-4 fw-bold">4</td>
                        <td class="text-start">
                            <div class="d-flex align-items-center">
                                <img src="../img/itr.jpg" class="team-logo-small me-3" alt="Logo Ricaldone">
                                <span class="fw-bold">Ricaldone</span>
                            </div>
                        </td>
                        <td>4</td>
                        <td>8</td>
                        <td>5</td>
                        <td>4</td>
                        <td>3</td>
                        <td>10</td>
                        <td>+1</td>
                        <td class="pe-4 fw-bold">4</td>
                    </tr>

                </tbody>
            </table>
        </div>
    </div>

</div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeoLeague - Agregar evento</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <main class="p-4 bg-light min-vh-100">
            <div class="bg-white rounded-4 p-4 mb-4 shadow-sm">

                <div class="mb-4">
                    <div class="d-flex align-items-center">
                        <button type="button" class="btn btn-link text-success p-0 fs-3" onclick="window.location.href='./gestionPartidos.html'"
                            aria-label="Volver">
                            ←
                        </button>
                        <div class="ms-3">
                            <h1 class="h2 fw-bold mb-1">
                                Agregar evento de partido
                            </h1>
                            <p class="text-muted mb-0">Fútbol Masculino</p>
                        </div>
                    </div>
                </div>

                <div class="row mb-4">
                    <div class="col-md-6">
                        <label class="form-label">Minuto</label>
                        <input type="number" class="form-control form-control-lg rounded-pill" placeholder="Minuto">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Tipo de evento</label>
                        <select class="form-select form-select-lg rounded-pill">
                            <option>Tipo de evento</option>
                            <option>Gol</option>
                            <option>Tarjeta amarilla</option>
                            <option>Tarjeta roja</option>
                            <option>Cambio</option>
                        </select>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label">Jugador</label>
                    <select class="form-select form-select-lg rounded-pill">
                        <option>Seleccionar jugador</option>
                    </select>
                </div>

                <div class="mb-4">
                    <label class="form-label">Detalle</label>
                    <input type="text" class="form-control form-control-lg rounded-pill" placeholder="Detalle">
                </div>

                <div class="text-end mb-5">
                    <button type="button" class="btn btn-success rounded-pill px-4 py-2">
                        <img src="../img/plus.png" alt="Agregar" width="24" height="24" class="btn-icon-space">
                        Agregar otro evento
                    </button>
                    <button type="button" class="btn btn-success rounded-pill px-4 py-2">
                        <img src="../img/Vector.png" alt="Guardar" width="24" height="24" class="btn-icon-space">
                        Guardar evento
                    </button>
                    <button type="button" class="btn btn-danger rounded-pill px-4 py-2">
                        <img src="../img/trashGray.png" alt="Eliminar" width="20" height="20" class="btn-icon-space">
                        Eliminar
                    </button>
                </div>

                <div class="table-responsive rounded-3 shadow-sm">
                    <table class="table table-hover align-middle mb-0">
                        <thead>
                            <tr>
                                <th>Min</th>
                                <th>Tipo</th>
                                <th>Jugador</th>
                                <th>Detalle</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>46</td>
                                <td>Gol</td>
                                <td>Dimas Samuel</td>
                                <td>-</td>
                                <td>
                                    <button type="button" class="btn btn-link p-0">
                                        <img src="../img/Tools.png" alt="Editar" width="22" height="22">
                                    </button>
                                    <button type="button" class="btn btn-link p-0">
                                        <img src="../img/trashRed.png" alt="Eliminar" width="22" height="22">
                                    </button>
                                </td>
                            </tr>
                            <tr>
                                <td>50</td>
                                <td>Tarjeta amarilla</td>
                                <td>Fernando Guillen</td>
                                <td>-</td>
                                <td>
                                    <button type="button" class="btn btn-link p-0">
                                        <img src="../img/Tools.png" alt="Editar" width="22" height="22">
                                    </button>
                                    <button type="button" class="btn btn-link p-0">
                                        <img src="../img/trashRed.png" alt="Eliminar" width="22" height="22">
                                    </button>
                                </td>
                            </tr>
                            <tr>
                                <td>70</td>
                                <td>Cambio</td>
                                <td>Andre Lopez</td>
                                <td>Sale Dimas Samuel<br>Entra Andre Lopez</td>
                                <td>
                                    <button type="button" class="btn btn-link p-0">
                                        <img src="../img/Tools.png" alt="Editar" width="22" height="22">
                                    </button>
                                    <button type="button" class="btn btn-link p-0">
                                        <img src="../img/trashRed.png" alt="Eliminar" width="22" height="22">
                                    </button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

            </div>
        </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>

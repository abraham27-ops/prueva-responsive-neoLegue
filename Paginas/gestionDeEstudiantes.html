  <div class="container mt-4">
    <main>
      <div>
        <h1>Informacion Personal</h1>
      </div>
      <section class="row bg-white rounded-5 shadow-sm p-4 mt-3">
        <div class="col-4">
          <label class="form-label">Foto de Estudiante</label>

          <div class="subir-foto bg-secondary-subtle rounded-5 p-5 text-center">
            <h3>📷</h3>
            <h4>Subir Foto</h4>
            <p>Arrastra aqui</p>
          </div>
          <button class="btn btn-success rounded-pill px-5 mt-4">
            Crear Estudiante
          </button>
        </div>
        <div class="col-4">
          <div class="mb-3">
            <label class="form-label">Codigo estudiante</label>

            <input type="text" class="form-control campo" placeholder="Codigo">
            <label class="form-label">Nombre</label>

            <input type="text" class="form-control campo" placeholder="Nombre">
            <label class="form-label">Apellido</label>

            <input type="text" class="form-control campo" placeholder="Apellido">
            <label class="form-label">Fecha de nacimiento</label>

            <input type="date" class="form-control campo" placeholder="Fecha de nacimiento">
          </div>
        </div>
        <div class="col-4">
          <label class="form-label">Especialidad</label>
          <select class="form-select rounded-pill shadow-sm">
            <option>Software</option>
            <option>Diseño</option>
            <option>Arquitectura</option>
          </select>
          <label class="form-label">Grado</label>

          <input type="text" class="form-control campo" placeholder="Grado">
          <label class="form-label">Seccion</label>

          <input type="text" class="form-control campo" placeholder="Seccion">
          <label class="form-label">Equipos</label>
          <select class="form-select rounded-pill shadow-sm">
            <option>ricaldone</option>
            <option>Maria auxiliadora</option>
            <option>Chaleco</option>
          </select>
        </div>
  </div>

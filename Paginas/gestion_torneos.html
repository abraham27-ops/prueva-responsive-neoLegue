<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Torneos - NeoLeague</title>
    
    <!-- Link de Css Bootstrap -->
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/gestion_torneos.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <!-- Link de Iconos Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <!-- Link de Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Favicon -->
    <link rel="icon" href="../img/descarga.png">
</head>

<body class="bg-light">
    <!-- Navbar y Menú Lateral dinámicos -->
    <div id="nav-placeholder"></div>

    <!-- Main -->
    <main class="container-fluid py-4 px-4 px-lg-5 max-w-1200 mx-auto" style="max-width: 1400px;">
        
        <!-- Encabezado con Migas de Pan (Estilo Partidos) -->
        <div class="d-flex flex-wrap justify-content-between align-items-end mb-4 mt-3 gap-3">
            <div>
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb mb-1">
                        <li class="breadcrumb-item"><a href="inicio.html" class="text-decoration-none text-muted">Inicio</a></li>
                        <li class="breadcrumb-item active fw-semibold" aria-current="page">Gestión de Torneos</li>
                    </ol>
                </nav>
                <h1 class="fw-bold m-0 text-dark">Torneos Oficiales</h1>
            </div>

            <div class="d-flex flex-wrap align-items-center gap-3">
                <button type="button" class="btn btn-success px-4 py-2 fw-semibold rounded-pill shadow-sm d-flex align-items-center" data-bs-toggle="modal" data-bs-target="#modalCrearTorneo" id="btnAbrirModalCrear" style="background-color: var(--nl-green-primary); border: none; height: 44px;">
                    <i class="bi bi-plus-circle me-2"></i>Crear Torneo
                </button>
            </div>
        </div>

        <!-- Barra de Filtros y Búsqueda (Estilo Partidos) -->
        <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-4">
            <div class="d-flex flex-wrap align-items-center gap-3 flex-grow-1">
                <!-- Buscador (Ahora primero) -->
                <div class="bg-white shadow-sm rounded-pill px-4 py-2 d-flex align-items-center border flex-grow-1" style="max-width: 400px;">
                    <input type="text" id="txtBuscarTorneo" class="form-control border-0 bg-transparent fw-semibold shadow-none p-0 text-dark" placeholder="Buscar por nombre o año (ej. 2026)...">
                </div>

                <!-- Filtro Deporte -->
                <div class="bg-white shadow-sm rounded-pill px-3 py-1 d-flex align-items-center border" style="min-width: 220px;">
                    <select id="filtroDeporte" class="form-select border-0 bg-transparent fw-semibold text-dark shadow-none" style="cursor: pointer;">
                        <option value="">Todos los deportes</option>
                        <option value="Fútbol">Fútbol</option>
                        <option value="Baloncesto">Baloncesto</option>
                        <option value="Natación">Natación</option>
                        <option value="Voleibol">Voleibol</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Cuadrícula de Torneos (Cards) -->
        <section class="row g-4" id="contenedorTorneos">
            <!-- Cargado dinámicamente desde JS -->
        </section>

    </main>

    <!-- Modal para Crear / Editar Torneo -->
    <div class="modal fade" id="modalCrearTorneo" tabindex="-1" aria-labelledby="modalCrearTorneoLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content rounded-4 border-0 shadow">
                <div class="modal-header border-bottom-0 pt-4 px-4 pb-0">
                    <h4 class="modal-title fw-bold text-dark" id="modalCrearTorneoLabel">Crear Nuevo Torneo</h4>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <form id="frmTorneo" onsubmit="return false;">
                    <input type="hidden" id="idTorneo">
                    <div class="modal-body p-4">
                        <div class="row g-3">
                            <!-- Nombre del Torneo -->
                            <div class="col-md-8">
                                <label for="txtNombreTorneo" class="form-label form-label-custom">Nombre del Torneo <span class="text-danger">*</span></label>
                                <input type="text" class="form-control form-control-custom" id="txtNombreTorneo" placeholder="Ej. Copa NeoLeague de Invierno" required>
                            </div>

                            <!-- Año del Torneo -->
                            <div class="col-md-4">
                                <label for="txtAnioTorneo" class="form-label form-label-custom">Año del Torneo <span class="text-danger">*</span></label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0 rounded-start-3"><i class="fas fa-calendar-alt text-success"></i></span>
                                    <input type="number" class="form-control form-control-custom border-start-0" id="txtAnioTorneo" placeholder="2026" min="2020" max="2035" required value="2026">
                                </div>
                            </div>

                            <!-- Deporte -->
                            <div class="col-md-6">
                                <label for="selDeporteTorneo" class="form-label form-label-custom">Deporte <span class="text-danger">*</span></label>
                                <select class="form-select form-select-custom" id="selDeporteTorneo" required>
                                    <option value="" selected disabled>Seleccionar deporte...</option>
                                    <option value="Fútbol">Fútbol</option>
                                    <option value="Baloncesto">Baloncesto</option>
                                    <option value="Natación">Natación</option>
                                    <option value="Voleibol">Voleibol</option>
                                </select>
                            </div>

                            <!-- Categoría -->
                            <div class="col-md-6">
                                <label for="selCategoriaTorneo" class="form-label form-label-custom">Categoría <span class="text-danger">*</span></label>
                                <select class="form-select form-select-custom" id="selCategoriaTorneo" required>
                                    <option value="" selected disabled>Seleccionar categoría...</option>
                                    <option value="Sub-15">Sub-15 (Infantil)</option>
                                    <option value="Sub-18">Sub-18 (Juvenil)</option>
                                    <option value="Libre">Libre (Universitario / Mayor)</option>
                                    <option value="Femenino Sub-17">Femenino Sub-17</option>
                                </select>
                            </div>

                            <!-- Tipo de Torneo -->
                            <div class="col-md-12">
                                <label for="selTipoTorneo" class="form-label form-label-custom">Tipo de Torneo <span class="text-danger">*</span></label>
                                <select class="form-select form-select-custom" id="selTipoTorneo" required>
                                    <option value="Liga (Todos contra todos)">Liga (Todos contra todos)</option>
                                    <option value="Eliminatoria directa / Play-offs">Eliminatoria directa / Play-offs</option>
                                    <option value="Grupos y Eliminatoria">Grupos y Eliminatoria</option>
                                    <option value="Torneo Relámpago">Torneo Relámpago</option>
                                </select>
                            </div>

                            <!-- Fecha de Inicio -->
                            <div class="col-md-4">
                                <label for="txtFechaInicio" class="form-label form-label-custom">Fecha de Inicio <span class="text-danger">*</span></label>
                                <input type="date" class="form-control form-control-custom" id="txtFechaInicio" required>
                            </div>

                            <!-- Fecha de Fin -->
                            <div class="col-md-4">
                                <label for="txtFechaFin" class="form-label form-label-custom">Fecha de Fin <span class="text-muted small">(Opcional)</span></label>
                                <input type="date" class="form-control form-control-custom" id="txtFechaFin">
                            </div>

                            <!-- Estado -->
                            <div class="col-md-4">
                                <label for="selEstadoTorneo" class="form-label form-label-custom">Estado <span class="text-danger">*</span></label>
                                <select class="form-select form-select-custom" id="selEstadoTorneo" required>
                                    <option value="Programado">Programado</option>
                                    <option value="En Curso">En Curso</option>
                                    <option value="Finalizado">Finalizado</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer bg-light px-4 py-3 border-top">
                        <button type="button" class="btn btn-secondary rounded-pill px-4" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-success rounded-pill px-4 fw-bold shadow-sm" id="btnGuardarTorneo" style="background-color: var(--nl-green-primary); border-color: var(--nl-green-primary);">
                            <i class="fas fa-save me-1"></i> Guardar Torneo
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Link de SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- Script de Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    <!-- Scripts Institucionales -->
    <script src="../js/global.js"></script>
    <script src="../js/controllers/gestion_torneos.controllers.js"></script>
</body>

</html>

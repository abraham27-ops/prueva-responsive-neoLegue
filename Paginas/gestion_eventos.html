<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Eventos - NeoLeague</title>
    
    <!-- Link de Css Bootstrap -->
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/gestion_eventos.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <!-- Link de Iconos Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <!-- Link de Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Favicon -->
    <link rel="icon" href="../img/descarga.png">
</head>

<body class="bg-light">
    <!-- Navbar y Menú Lateral dinámicos -->
    <div id="nav-placeholder"></div>

    <!-- Main -->
    <main class="container py-4">
        
        <!-- Encabezado con Migas de Pan (Estilo Partidos) -->
        <div class="d-flex flex-wrap justify-content-between align-items-end mb-4 mt-3 gap-3">
            <div>
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb mb-1">
                        <li class="breadcrumb-item"><a href="inicio.html" class="text-decoration-none text-muted">Inicio</a></li>
                        <li class="breadcrumb-item active fw-semibold" aria-current="page">Gestión de Eventos</li>
                    </ol>
                </nav>
                <h1 class="fw-bold m-0 text-dark">Catálogo de Eventos</h1>
            </div>

            <div class="d-flex flex-wrap align-items-center gap-3">
                <button type="button" class="btn btn-success px-4 py-2 fw-semibold rounded-pill shadow-sm d-flex align-items-center" data-bs-toggle="modal" data-bs-target="#modalCrearEvento" id="btnAbrirModalCrear" style="background-color: var(--nl-green-primary); border: none; height: 44px;">
                    <i class="bi bi-plus-circle me-2"></i>Nuevo Evento
                </button>
            </div>
        </div>

        <!-- Panel de Filtros Separados (Estilo Partidos) -->
        <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-5">
            <div class="d-flex flex-wrap align-items-center gap-3 flex-grow-1">
                <!-- Buscador (Ahora primero) -->
                <div class="bg-white shadow-sm rounded-pill px-4 py-2 d-flex align-items-center border flex-grow-1" style="min-width: 260px; max-width: 400px;">
                    <input type="text" id="txtBuscarEvento" class="form-control border-0 bg-transparent fw-semibold shadow-none p-0 text-dark" placeholder="Buscar por nombre...">
                </div>

                <!-- Filtro Tipo -->
                <div class="bg-white shadow-sm rounded-pill px-3 py-1 d-flex align-items-center border" style="min-width: 200px;">
                    <select id="selFiltroTipo" class="form-select border-0 bg-transparent fw-semibold text-dark shadow-none" style="cursor: pointer;">
                        <option value="">Todos los tipos</option>
                        <option value="Acciones de juego">Acciones de juego</option>
                        <option value="Sanción">Sanciones</option>
                    </select>
                </div>

                <!-- Filtro Deporte -->
                <div class="bg-white shadow-sm rounded-pill px-3 py-1 d-flex align-items-center border" style="min-width: 220px;">
                    <select id="selFiltroDeporte" class="form-select border-0 bg-transparent fw-semibold text-dark shadow-none" style="cursor: pointer;">
                        <option value="">Todos los deportes</option>
                        <option value="Fútbol">Fútbol</option>
                        <option value="Baloncesto">Baloncesto</option>
                        <option value="Natación">Natación</option>
                        <option value="Voleibol">Voleibol</option>
                        <option value="Todos">General (Todos)</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Sección Principal: Tabla Completa -->
        <section class="row g-4">
            <div class="col-12">
                <div class="card-custom">
                    <div class="card-header-custom d-flex justify-content-between align-items-center flex-wrap gap-2">
                        <h5 class="fw-bold mb-0 text-dark d-flex align-items-center">
                            <i class="fas fa-list-ul text-success me-2"></i> Catálogo Oficial de Eventos
                        </h5>
                        <span class="badge bg-success bg-opacity-10 text-success border border-success fw-semibold px-3 py-2 rounded-pill" id="contadorEventos">
                            0 eventos en el catálogo
                        </span>
                    </div>

                    <div class="table-responsive">
                        <table class="table table-custom table-hover align-middle mb-0 text-center">
                            <thead>
                                <tr>
                                    <th style="width: 10%;">ID</th>
                                    <th class="text-start" style="width: 28%;">Nombre del Evento</th>
                                    <th style="width: 20%;">Tipo de Evento</th>
                                    <th style="width: 18%;">Deporte Aplicable</th>
                                    <th style="width: 14%;">Valor / Impacto</th>
                                    <th style="width: 10%;">Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="tablaEventos">
                                <!-- Aquí se cargarán los eventos desde JavaScript -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <!-- Modal para Crear / Editar Evento -->
    <div class="modal fade" id="modalCrearEvento" tabindex="-1" aria-labelledby="modalCrearEventoLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content rounded-4 shadow border-0 overflow-hidden">
                <div class="modal-header border-bottom-0 pt-4 px-4 pb-0">
                    <h4 class="modal-title fw-bold text-dark" id="modalCrearEventoLabel">Nuevo Evento Oficial</h4>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                
                <form id="frmEvento" onsubmit="return false;">
                    <input type="hidden" id="idEvento">
                    
                    <div class="modal-body p-4">
                        <div class="row g-3">
                            <!-- Nombre del evento -->
                            <div class="col-12">
                                <label for="txtNombreEvento" class="form-label form-label-custom">
                                    Nombre del Evento <span class="text-danger">*</span>
                                </label>
                                <input type="text" id="txtNombreEvento" class="form-control form-control-custom" placeholder="Ej. Tarjeta Amarilla, Gol de Campo, Canasta 3 Pts" required>
                            </div>

                            <!-- Tipo de evento (Acción de juego o Sanción) -->
                            <div class="col-md-6">
                                <label for="selTipoEvento" class="form-label form-label-custom">
                                    Tipo de Evento <span class="text-danger">*</span>
                                </label>
                                <select id="selTipoEvento" class="form-select form-select-custom" required>
                                    <option value="" selected disabled>Seleccionar tipo...</option>
                                    <option value="Acciones de juego">Acciones de juego</option>
                                    <option value="Sanción">Sanción</option>
                                </select>
                            </div>

                            <!-- Deporte aplicable -->
                            <div class="col-md-6">
                                <label for="selDeporteEvento" class="form-label form-label-custom">
                                    Deporte Aplicable <span class="text-danger">*</span>
                                </label>
                                <select id="selDeporteEvento" class="form-select form-select-custom" required>
                                    <option value="" selected disabled>Seleccionar deporte...</option>
                                    <option value="Todos">Todos los deportes</option>
                                    <option value="Fútbol">Fútbol</option>
                                    <option value="Baloncesto">Baloncesto</option>
                                    <option value="Natación">Natación</option>
                                    <option value="Voleibol">Voleibol</option>
                                </select>
                            </div>

                            <!-- Valor / Impacto -->
                            <div class="col-12">
                                <label for="txtValorEvento" class="form-label form-label-custom">
                                    Valor / Puntos / Impacto <span class="text-danger">*</span>
                                </label>
                                <input type="text" id="txtValorEvento" class="form-control form-control-custom" placeholder="Ej. +1 Gol, +3 Puntos, Advertencia, Expulsión" required>
                            </div>

                            <!-- Descripción -->
                            <div class="col-12">
                                <label for="txtDescEvento" class="form-label form-label-custom">
                                    Descripción o Regla <span class="text-muted small">(Opcional)</span>
                                </label>
                                <textarea id="txtDescEvento" class="form-control form-control-custom" rows="2" placeholder="Breve explicación de cuándo se registra este evento en el acta del partido..."></textarea>
                            </div>
                        </div>
                    </div>

                    <div class="modal-footer bg-light px-4 py-3 border-top">
                        <button type="button" class="btn btn-secondary rounded-pill px-4" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" id="btnGuardarEvento" class="btn btn-success rounded-pill px-4 fw-bold shadow-sm" style="background-color: var(--nl-green-primary); border-color: var(--nl-green-primary);">
                            <i class="fas fa-save me-1"></i> Guardar Evento
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Link de SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- Script de Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    <!-- Scripts Institucionales -->
    <script src="../js/global.js"></script>
    <script src="../js/controllers/gestion_eventos.controllers.js"></script>
</body>

</html>
